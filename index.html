        --surface: #1A1A1A;
        --muted: #A3A19C;
        --muted-2: #7A7873;
        --border: #2B2B2A;
        --red: #FF5A50;
        --red-dark: #FF7B6F;
        --red-tint: #2A1917;
        --green: #3FCB8E;
        --green-tint: #132420;
        --amber: #E8A83C;
        --amber-tint: #2A2013;
        --clay-shadow: 10px 10px 22px rgba(0, 0, 0, 0.55), -8px -8px 18px rgba(255, 255, 255, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        --clay-shadow-sm: 5px 5px 12px rgba(0, 0, 0, 0.5), -4px -4px 10px rgba(255, 255, 255, 0.025);
        --clay-shadow-pressed: inset 4px 4px 10px rgba(0, 0, 0, 0.5), inset -3px -3px 8px rgba(255, 255, 255, 0.03);
        --flat-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-padding-top: var(--safe-t);
      -webkit-text-size-adjust: 100%;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--black);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      padding-top: var(--safe-t);
      padding-bottom: var(--safe-b);
      overflow-x: hidden;
      transition: background .25s ease, color .25s ease;
    }

    h1,
    h2,
    h3,
    h4,
    .font-display {
      font-family: var(--font-display);
    }

    p {
      line-height: 1.55;
    }

    a {
      color: inherit;
    }

    button {
      font-family: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    ::selection {
      background: var(--red-tint);
      color: var(--red-dark);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .scroll-x {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .scroll-x::-webkit-scrollbar {
      height: 6px;
    }

    .scroll-x::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 10px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* PRELOADER */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: var(--black);
      transition: opacity .5s ease, visibility .5s ease;
    }

    #preloader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .pre-logo {
      width: 132px;
      animation: preScale 1.0s cubic-bezier(.2, .8, .3, 1) both;
    }

    @keyframes preScale {
      0% {
        transform: scale(.85);
        opacity: 0;
      }

      60% {
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .pre-sub {
      font-family: var(--font-body);
      font-size: 12.5px;
      color: #9A9A9A;
      opacity: 0;
      animation: preFade .6s ease .5s forwards;
      text-align: center;
    }

    @keyframes preFade {
      to {
        opacity: 1;
      }
    }

    .pre-bar {
      width: 120px;
      height: 3px;
      border-radius: 4px;
      background: #2A2A2A;
      overflow: hidden;
      opacity: 0;
      animation: preFade .4s ease .8s forwards;
    }

    .pre-bar span {
      display: block;
      height: 100%;
      width: 40%;
      background: var(--red);
      border-radius: 4px;
      animation: preSlide 1.1s ease-in-out infinite;
    }

    @keyframes preSlide {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(280%);
      }
    }

    .logo-icon-img {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .logo-full-img {
      width: 112px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 19px;
      letter-spacing: 0.1px;
      color: var(--black);
      line-height: 1;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      margin-top: 2px;
    }

    /* BUTTONS */
    .btn {
      --btnpad: 11px 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: var(--btnpad);
      border-radius: 14px;
      border: 1px solid transparent;
      font-weight: 600;
      font-size: 14.5px;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
      user-select: none;
      white-space: nowrap;
    }

    .btn:active {
      transform: translateY(1px) scale(.99);
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 14px rgba(229, 57, 53, 0.3), var(--clay-shadow-sm);
    }

    .btn-primary:hover {
      background: var(--red-dark);
    }

    .btn-primary[disabled] {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--black);
      border-color: var(--border);
      box-shadow: var(--clay-shadow-sm);
    }

    .btn-secondary:hover {
      border-color: var(--muted-2);
    }

    .btn-ghost {
      background: transparent;
      color: var(--black);
      border-color: transparent;
    }

    .btn-ghost:hover {
      background: rgba(0, 0, 0, 0.045);
    }

    :root[data-theme="dark"] .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-sm {
      padding: 7px 14px;
      font-size: 13px;
      border-radius: 11px;
    }

    .btn-block {
      width: 100%;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 12px;
    }

    .btn[disabled] {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-google svg {
      width: 16px;
      height: 16px;
    }

    /* INPUTS */
    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 16px;
    }

    .field label {
      font-size: 13px;
      font-weight: 600;
      color: var(--soft-black);
    }

    .field .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: -3px;
    }

    .input,
    select.input {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--black);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14.5px;
      font-family: inherit;
      box-shadow: var(--clay-shadow-pressed);
      transition: border-color .15s ease, box-shadow .15s ease;
      width: 100%;
    }

    .input::placeholder {
      color: var(--muted-2);
    }

    .input:focus {
      border-color: var(--red);
      box-shadow: var(--clay-shadow-pressed), 0 0 0 3px var(--red-tint);
    }

    .input:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    select.input {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23737373' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
      padding-right: 38px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .input {
      padding-right: 44px;
    }

    .input-wrap .eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13.5px;
      color: var(--soft-black);
    }

    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--red);
      border-radius: 5px;
      flex-shrink: 0;
    }

    /* OTP */
    .otp-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 6px 0 4px;
    }

    .otp-box {
      width: 44px;
      height: 52px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--clay-shadow-pressed);
      color: var(--black);
    }

    .otp-box:focus {
      border-color: var(--red);
      box-shadow: var(--clay-shadow-pressed), 0 0 0 3px var(--red-tint);
    }

    @media (max-width:380px) {
      .otp-box {
        width: 36px;
        height: 46px;
        font-size: 17px;
      }

      .otp-row {
        gap: 6px;
      }
    }

    /* CARDS */
    .card {
      background: var(--surface);
      border-radius: var(--r-lg);
      border: 1px solid var(--border);
    }

    .clay {
      box-shadow: var(--clay-shadow);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    :root[data-theme="dark"] .clay {
      border-color: rgba(255, 255, 255, 0.04);
    }

    .flat {
      box-shadow: var(--flat-shadow);
    }

    .pad-lg {
      padding: 26px;
    }

    .pad-md {
      padding: 20px;
    }

    .pad-sm {
      padding: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 20px;
      line-height: 1;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .badge-green {
      background: var(--green-tint);
      color: var(--green);
    }

    .badge-amber {
      background: var(--amber-tint);
      color: var(--amber);
    }

    .badge-red {
      background: var(--red-tint);
      color: var(--red);
    }

    .badge-neutral {
      background: var(--bg);
      color: var(--muted);
    }

    /* LAYOUT */
    #app {
      display: none;
    }

    #app.active {
      display: block;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 60;
      transition: transform .25s ease;
    }

    .sidebar-brand {
      padding: 6px 10px 20px 10px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 13px;
      color: var(--soft-black);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background .15s ease, color .15s ease, transform .1s ease;
    }

    .nav-item svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
    }

    .nav-item:hover {
      background: var(--bg);
    }

    .nav-item.active {
      background: var(--red);
      color: #fff;
      box-shadow: 0 3px 10px rgba(229, 57, 53, 0.28);
    }

    .nav-item.active svg {
      color: #fff;
    }

    .sidebar-foot {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .main-col {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topheader {
      height: var(--header-h);
      padding-top: var(--safe-t);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 28px;
      padding-right: 28px;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 40;
      gap: 12px;
    }

    .topheader-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }

    .page-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 19px;
      color: var(--black);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page-sub {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topheader-right {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }

    .menu-btn {
      display: none;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--soft-black);
      cursor: pointer;
      box-shadow: var(--clay-shadow-sm);
      position: relative;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      color: var(--red);
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
    }

    .icon-btn .dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      border: 2px solid var(--bg);
      display: none;
    }

    .theme-toggle {
      width: 56px;
      height: 32px;
      border-radius: 30px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--clay-shadow-pressed);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }

    .theme-toggle .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--black);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: left .25s cubic-bezier(.4, 0, .2, 1), background .25s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .theme-toggle .knob svg {
      width: 13px;
      height: 13px;
    }

    :root[data-theme="dark"] .theme-toggle .knob {
      left: 27px;
      background: var(--red);
    }

    .profile-chip {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 12px 5px 5px;
      border-radius: 30px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--clay-shadow-sm);
      cursor: pointer;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
    }

    .profile-chip .pname {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.1;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-chip .prole {
      font-size: 11px;
      color: var(--muted);
    }

    .content {
      padding: 22px 28px 100px;
    }

    @media (min-width:1180px) {
      .content {
        padding: 26px 34px 60px;
      }
    }

    .view {
      display: none;
      animation: viewIn .3s ease;
    }

    .view.active {
      display: block;
    }

    @keyframes viewIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .grid {
      display: grid;
      gap: 20px;
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid-dash {
      grid-template-columns: 1.3fr 1fr;
    }

    @media (max-width:1100px) {
      .grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid-dash {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width:640px) {

      .grid-4,
      .grid-3,
      .grid-2 {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .grid {
        gap: 14px;
      }
    }

    section.block {
      margin-bottom: 24px;
    }

    .block-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .block-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 17px;
    }

    .block-link {
      font-size: 13px;
      font-weight: 600;
      color: var(--red);
      cursor: pointer;
      white-space: nowrap;
    }

    .bottom-nav {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 7px 4px calc(7px + var(--safe-b));
      justify-content: space-around;
      box-shadow: 0 -6px 18px rgba(0, 0, 0, 0.06);
    }

    .bn-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 10px;
      cursor: pointer;
      max-width: 78px;
      overflow: hidden;
    }

    .bn-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    .bn-item svg {
      width: 20px;
      height: 20px;
    }

    .bn-item.active {
      color: var(--red);
    }

    .sidebar-scrim {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 55;
    }

    .sidebar-scrim.show {
      display: block;
    }

    @media (max-width:900px) {
      .sidebar {
        transform: translateX(-105%);
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.2);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main-col {
        margin-left: 0;
      }

      .menu-btn {
        display: flex;
      }

      .bottom-nav {
        display: flex;
      }

      .content {
        padding: 16px 14px 92px;
      }

      .topheader {
        padding-left: 14px;
        padding-right: 14px;
        height: 60px;
      }

      .page-title {
        font-size: 16.5px;
      }

      .page-sub {
        display: none;
      }

      .profile-chip .pname,
      .profile-chip .prole {
        display: none;
      }

      .profile-chip {
        padding: 5px;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
      }

      .theme-toggle {
        width: 50px;
        height: 29px;
      }

      .theme-toggle .knob {
        width: 21px;
        height: 21px;
      }

      :root[data-theme="dark"] .theme-toggle .knob {
        left: 26px;
      }
    }

    @media (max-width:480px) {
      .pad-lg {
        padding: 18px;
      }

      .pad-md {
        padding: 15px;
      }

      .modal-body {
        padding: 16px !important;
      }

      .modal-head {
        padding: 16px !important;
      }

      .modal-foot {
        padding: 12px 16px !important;
        flex-wrap: wrap;
      }

      .stat-value {
        font-size: 22px !important;
      }

      .two-col {
        gap: 10px;
      }

      .auth-card {
        padding: 26px 18px !important;
      }

      table.sams-table {
        font-size: 12.5px;
      }
    }

    /* TABLES */
    .table-wrap {
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    table.sams-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      min-width: 560px;
    }

    table.sams-table th {
      text-align: left;
      padding: 12px 16px;
      background: var(--bg);
      color: var(--muted);
      font-weight: 700;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
    }

    table.sams-table td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--soft-black);
    }

    table.sams-table tr:last-child td {
      border-bottom: none;
    }

    table.sams-table tbody tr {
      transition: background .12s ease;
    }

    table.sams-table tbody tr:hover {
      background: var(--bg);
    }

    /* TABS / SEGMENTED */
    .tabs {
      display: inline-flex;
      padding: 4px;
      background: var(--bg);
      border-radius: 14px;
      gap: 2px;
      box-shadow: var(--clay-shadow-pressed);
      max-width: 100%;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 9px 18px;
      border-radius: 11px;
      font-weight: 600;
      font-size: 13.5px;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all .18s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--black);
      box-shadow: var(--clay-shadow-sm);
    }

    .segmented {
      display: inline-flex;
      border-radius: 12px;
      background: var(--bg);
      padding: 3px;
      gap: 2px;
      box-shadow: var(--clay-shadow-pressed);
      max-width: 100%;
      overflow-x: auto;
    }

    .seg-btn {
      border: none;
      background: transparent;
      padding: 8px 14px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      color: var(--muted);
      transition: all .15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .seg-btn.present.active {
      background: var(--green);
      color: #fff;
    }

    .seg-btn.absent.active {
      background: var(--red);
      color: #fff;
    }

    .seg-btn.notmarked.active {
      background: var(--muted-2);
      color: #fff;
    }

    /* PROGRESS */
    .ring-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-num {
      position: absolute;
      text-align: center;
    }

    .ring-num .big {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 30px;
      display: block;
      line-height: 1;
    }

    .ring-num .small {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .bar-track {
      height: 9px;
      background: var(--bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--clay-shadow-pressed);
    }

    .bar-fill {
      height: 100%;
      border-radius: 20px;
      transition: width .5s cubic-bezier(.4, 0, .2, 1);
    }

    .stat-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .stat-card .stat-label {
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-card .stat-value {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 26px;
      overflow-wrap: anywhere;
    }

    .stat-card .stat-delta {
      font-size: 12px;
      font-weight: 700;
    }

    .subject-card {
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .subject-card:hover {
      transform: translateY(-2px);
    }

    .subj-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      gap: 10px;
    }

    .subj-name {
      font-weight: 700;
      font-size: 15px;
    }

    .subj-code {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .subj-pct {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 22px;
      flex-shrink: 0;
    }

    .subj-meta {
      display: flex;
      gap: 16px;
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .subj-meta b {
      color: var(--soft-black);
      font-weight: 700;
    }

    .period-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 4px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .period-row:last-child {
      border-bottom: none;
    }

    .period-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .period-num {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .period-info {
      min-width: 0;
    }

    .period-info .pname {
      font-weight: 700;
      font-size: 13.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .period-info .ptime {
      font-size: 11.5px;
      color: var(--muted);
    }

    .empty-state {
      text-align: center;
      padding: 48px 18px;
    }

    .empty-state .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      color: var(--muted-2);
    }

    .empty-state h4 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 16px;
      margin: 0 0 6px;
    }

    .empty-state p {
      color: var(--muted);
      font-size: 13.5px;
      max-width: 320px;
      margin: 0 auto 18px;
    }

    .notif-item {
      display: flex;
      gap: 13px;
      padding: 15px 4px;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }

    .notif-item:last-child {
      border-bottom: none;
    }

    .notif-item.unread {
      background: linear-gradient(to right, var(--red-tint), transparent 70%);
    }

    .notif-ic {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .notif-ic svg {
      width: 17px;
      height: 17px;
    }

    .notif-body {
      flex: 1;
      min-width: 0;
    }

    .notif-title {
      font-weight: 700;
      font-size: 13.5px;
    }

    .notif-desc {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .notif-time {
      font-size: 11px;
      color: var(--muted-2);
      margin-top: 4px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, 0.45);
      backdrop-filter: blur(2px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--r-xl);
      max-width: 560px;
      width: 100%;
      max-height: 88vh;
      overflow: auto;
      box-shadow: var(--clay-shadow);
      animation: modalIn .22s cubic-bezier(.2, .8, .3, 1);
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .modal-body {
      padding: 22px;
    }

    .modal-foot {
      padding: 16px 22px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    #toast-region {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
      max-width: calc(100vw - 32px);
    }

    @media (max-width:900px) {
      #toast-region {
        left: 16px;
        right: 16px;
        bottom: calc(80px + var(--safe-b));
        align-items: stretch;
      }
    }

    .toast {
      background: var(--soft-black);
      color: #fff;
      padding: 13px 16px;
      border-radius: 13px;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.25);
      animation: toastIn .25s cubic-bezier(.2, .8, .3, 1);
      max-width: 340px;
    }

    :root[data-theme="dark"] .toast {
      background: #2A2A2A;
    }

    .toast.error svg {
      color: #FF7B6F;
    }

    .toast.success svg {
      color: #3FCB8E;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .toast svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .skel {
      background: linear-gradient(90deg, var(--border) 25%, var(--bg) 37%, var(--border) 63%);
      background-size: 400% 100%;
      animation: skelShine 1.4s ease infinite;
      border-radius: 10px;
    }

    @keyframes skelShine {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: 0 0;
      }
    }

    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      animation: spin .7s linear infinite;
      display: inline-block;
    }

    .spinner.dark {
      border-color: rgba(0, 0, 0, 0.15);
      border-top-color: var(--red);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .center-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
      gap: 10px;
      color: var(--muted);
      font-size: 13.5px;
    }

    #auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
    }

    .auth-wrap {
      width: 100%;
      max-width: 420px;
    }

    .auth-card {
      padding: 34px 32px;
    }

    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .auth-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 22px;
      text-align: center;
    }

    .auth-sub {
      font-size: 13.5px;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted-2);
      font-size: 12px;
      margin: 18px 0;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .auth-foot {
      text-align: center;
      font-size: 13.5px;
      color: var(--muted);
      margin-top: 18px;
    }

    .auth-foot a,
    .link-red {
      color: var(--red);
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .admin-strip {
      background: var(--soft-black);
      color: #fff;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      padding: 8px;
      border-radius: 12px;
      margin-bottom: 16px;
      letter-spacing: 0.03em;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width:480px) {
      .two-col {
        grid-template-columns: 1fr;
      }
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend i {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      display: inline-block;
    }

    .muted {
      color: var(--muted);
    }

    .text-red {
      color: var(--red);
    }

    .text-green {
      color: var(--green);
    }

    .text-amber {
      color: var(--amber);
    }

    .mt-0 {
      margin-top: 0;
    }

    .mb-0 {
      margin-bottom: 0;
    }

    .flex {
      display: flex;
    }

    .items-center {
      align-items: center;
    }

    .justify-between {
      justify-content: space-between;
    }

    .gap-8 {
      gap: 8px;
    }

    .gap-12 {
      gap: 12px;
    }

    hr.div {
      border: none;
      border-top: 1px solid var(--border);
      margin: 18px 0;
    }

    .field-error {
      color: var(--red);
      font-size: 12.5px;
      margin-top: -10px;
      margin-bottom: 14px;
    }
  </style>
</head>

    /* ============================================================
       MATH  (exact fractions — never rounded intermediates)
       ============================================================ */
    function pct(present, total) { return total > 0 ? (present / total) * 100 : 0; }
    function statusFor(v) { if (v >= SETTINGS.warning) return 'safe'; if (v >= SETTINGS.critical) return 'warning'; return 'critical'; }
    function statusMeta(s) { return { safe: { label: 'Safe', badge: 'badge-green', color: 'var(--green)' }, warning: { label: 'Warning', badge: 'badge-amber', color: 'var(--amber)' }, critical: { label: 'Critical', badge: 'badge-red', color: 'var(--red)' } }[s]; }
    function classesNeeded(present, total, targetPct) {
      const target = targetPct / 100;
      if (target <= 0) return 0;
      if (total > 0 && present / total >= target) return 0;
      if (target >= 1) return Infinity;
      const x = (target * total - present) / (1 - target);
      return Math.max(0, Math.ceil(x - 1e-9));
    }
    function safeLeavesAllowed(present, total, targetPct) {
      const target = targetPct / 100;
      if (target <= 0) return Infinity;
      if (total > 0 && present / total < target) return 0;
      const x = (present / target) - total;
      return Math.max(0, Math.floor(x + 1e-9));
    }
    function overallTotals() { return SUBJECTS.reduce((a, s) => ({ present: a.present + s.present, total: a.total + s.total }), { present: 0, total: 0 }); }

    /* ============================================================

    function toast(msg, kind = 'success') {
      const region = document.getElementById('toast-region');
      const el = document.createElement('div');
      el.className = 'toast ' + kind;
      el.innerHTML = (kind === 'success' ? ICONS.check : kind === 'error' ? ICONS.alert : ICONS.info) + `<span>${msg}</span>`;
      region.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(6px)'; el.style.transition = 'all .25s ease'; setTimeout(() => el.remove(), 260); }, 3400);
    }

    function initTheme() {
      let saved = null; try { saved = localStorage.getItem('sams-theme'); } catch (e) { }
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('sams-theme', next); } catch (e) { }
        if (document.getElementById('app').classList.contains('active')) renderView(STATE.view);
      });
    }
    function chartColors() {
      const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      return { text: dark ? '#A3A19C' : '#737373', grid: dark ? '#2B2B2A' : '#E5E2DD' };

    function renderForgotStep1() {
      document.getElementById('auth-card').innerHTML = `

      document.getElementById('forgot-form').addEventListener('submit', async (e) => {

        const btn = document.getElementById('forgot-submit'); btn.disabled = true; btn.innerHTML = spin() + ' Sending…';
        FORGOT_EMAIL = document.getElementById('fg-email').value.trim();
        const { error } = await sb.auth.signInWithOtp({ email: FORGOT_EMAIL, options: { shouldCreateUser: false } });
        if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = 'Send verification code'; return; }
        toast('Verification code sent to your email');
        renderForgotStep2();
      });

    function renderForgotStep2() {
      document.getElementById('auth-card').innerHTML = `
    ${authLogoHTML()}
    <div class="auth-title">Enter verification code</div>
    <div class="auth-sub">We sent a 6-digit code to <b>${FORGOT_EMAIL}</b></div>
    <form id="otp-form">
      <div class="otp-row">
        ${Array.from({ length: 6 }, (_, i) => `<input class="otp-box" inputmode="numeric" maxlength="1" data-otp="${i}">`).join('')}
      </div>
      <div id="otp-error" class="field-error" style="display:none; text-align:center;"></div>
      <button class="btn btn-primary btn-block" type="submit" id="otp-submit" style="margin-top:14px;">Verify code</button>
    </form>
    <div class="auth-foot"><span class="link-red" id="otp-resend">Resend code</span> · <a data-goto="forgot">Use a different email</a></div>
  `;
      const boxes = Array.from(document.querySelectorAll('[data-otp]'));
      boxes.forEach((b, i) => {
        b.addEventListener('input', () => { b.value = b.value.replace(/\D/g, '').slice(0, 1); if (b.value && boxes[i + 1]) boxes[i + 1].focus(); });
        b.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !b.value && boxes[i - 1]) boxes[i - 1].focus(); });
        b.addEventListener('paste', (e) => {
          const text = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
          if (text.length > 1) { e.preventDefault(); text.split('').forEach((ch, idx) => { if (boxes[idx]) boxes[idx].value = ch; }); boxes[Math.min(text.length, 6) - 1].focus(); }
        });
      });
      boxes[0].focus();
      document.getElementById('otp-resend').addEventListener('click', async () => {
        const { error } = await sb.auth.signInWithOtp({ email: FORGOT_EMAIL, options: { shouldCreateUser: false } });
        toast(error ? error.message : 'A new code has been sent', error ? 'error' : 'success');
      });
      document.getElementById('otp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('otp-error'); errEl.style.display = 'none';
        const token = boxes.map(b => b.value).join('');
        if (token.length !== 6) { errEl.textContent = 'Enter all 6 digits.'; errEl.style.display = 'block'; return; }
        const btn = document.getElementById('otp-submit'); btn.disabled = true; btn.innerHTML = spin() + ' Verifying…';
        const { error } = await sb.auth.verifyOtp({ email: FORGOT_EMAIL, token, type: 'email' });
        if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = 'Verify code'; return; }
        renderForgotStep3();
      });
      bindAuthNav();
    }
    function renderForgotStep3() {
      document.getElementById('auth-card').innerHTML = `
    ${authLogoHTML()}
    <div class="auth-title">Set a new password</div>

    <form id="newpass-form">
      <div class="field"><label>New password</label><input class="input" id="np-pass" type="password" minlength="6" placeholder="At least 6 characters" required></div>
      <div class="field"><label>Confirm password</label><input class="input" id="np-pass2" type="password" placeholder="Re-enter password" required></div>
      <div id="np-error" class="field-error" style="display:none;"></div>
      <button class="btn btn-primary btn-block" type="submit" id="np-submit">Update password</button>

      document.getElementById('newpass-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('np-error'); errEl.style.display = 'none';
        const p1 = document.getElementById('np-pass').value, p2 = document.getElementById('np-pass2').value;

    /* ============================================================

    const DB = {
      async getProfile() {
        const { data, error } = await sb.from('profiles').select('*').eq('id', CURRENT_USER.id).single();
        if (error) throw error; return data;
      },
      async getSettings() {
        let { data, error } = await sb.from('attendance_settings').select('*').eq('user_id', CURRENT_USER.id).maybeSingle();
        if (!data) {
          const ins = await sb.from('attendance_settings').insert({ user_id: CURRENT_USER.id }).select().single();
          data = ins.data;
        }
        return data;
      },
      async saveSettings(patch) {
        const { error } = await sb.from('attendance_settings').update(patch).eq('user_id', CURRENT_USER.id);
        if (error) throw error;
      },
      async saveProfile(patch) {
        const { error } = await sb.from('profiles').update(patch).eq('id', CURRENT_USER.id);
        if (error) throw error;
      },
      async getSubjects() { // counts come from the database view (v_subject_attendance), current semester only
        const { data, error } = await sb.from('v_subject_attendance').select('*')
          .eq('user_id', CURRENT_USER.id).eq('semester_id', SETTINGS.semesterId).order('subject_created_at');
        if (error) throw error;
        return (data || []).map(r => ({ id: r.subject_id, name: r.subject_name, code: r.subject_code, color: r.color || '#E53935', present: +r.total_present, total: +r.total_classes }));
      },
      async ensureSemester() {
        const { data, error } = await sb.rpc('ensure_active_semester');
        if (error) throw error; return data;
      },
      async startNewSemester(name, academicYear) {
        const { data, error } = await sb.rpc('start_new_semester', { p_name: name, p_academic_year: academicYear || null });
        if (error) throw error; return data;
      },
      async getSemesterHistory(userId) {
        const uid = userId || CURRENT_USER.id;
        const [sem, tot, sub] = await Promise.all([
          sb.from('semesters').select('*').eq('user_id', uid).order('started_at', { ascending: false }),
          sb.from('v_semester_attendance').select('*').eq('user_id', uid),
          sb.from('v_subject_attendance').select('*').eq('user_id', uid).order('subject_created_at')
        ]);
        if (sem.error) throw sem.error; if (tot.error) throw tot.error; if (sub.error) throw sub.error;
        return (sem.data || []).map(x => ({
          ...x,
          totals: (tot.data || []).find(t => t.semester_id === x.id) || { total_classes: 0, total_present: 0, total_absent: 0, attendance_percentage: 0 },
          subjects: (sub.data || []).filter(r => r.semester_id === x.id)
        }));
      },
      async setStudentStatus(id, status, note) {
        const { error } = await sb.rpc('set_student_status', { p_student: id, p_status: status, p_note: note || null });
        if (error) throw error;
      },
      async getTimetable() {
        const { data, error } = await sb.from('timetable').select('*').eq('user_id', CURRENT_USER.id).eq('semester_id', SETTINGS.semesterId);
        if (error) throw error;
        const tt = { Monday: [], Tuesday: [], Wednesday: [], Thursday: [], Friday: [], Saturday: [] };
        const times = DEFAULT_PERIOD_TIMES.slice();
        (data || []).forEach(row => {
          const arr = tt[row.day_of_week]; if (!arr) return;
          while (arr.length < row.period_number) arr.push(null);
          arr[row.period_number - 1] = row.subject_id;
          if (row.period_time) times[row.period_number - 1] = row.period_time;
        });
        return { timetable: tt, times };
      },
      async saveTimetableAndSubjects(tmpSubjects, tmpTimetable, periodsPerDay, semester) {
        const rn = await sb.from('semesters').update({ name: semester }).eq('id', SETTINGS.semesterId);
        if (rn.error) throw new Error(rn.error.code === '23505' ? 'You already have a semester with that name.' : rn.error.message);
        const existing = tmpSubjects.filter(s => !String(s.id).startsWith('new_'));
        const fresh = tmpSubjects.filter(s => String(s.id).startsWith('new_'));
        for (const s of existing) {
          await sb.from('subjects').update({ name: s.name, code: s.code, color: s.color }).eq('id', s.id);
        }
        const idMap = {};
        if (fresh.length) {
          const { data, error } = await sb.from('subjects').insert(fresh.map(s => ({ user_id: CURRENT_USER.id, semester_id: SETTINGS.semesterId, name: s.name, code: s.code, color: s.color }))).select();
          if (error) throw error;
          fresh.forEach((s, i) => { idMap[s.id] = data[i].id; });
        }
        // remap timetable temp ids -> real ids
        DAYS.forEach(d => { tmpTimetable[d] = (tmpTimetable[d] || []).map(sid => sid && idMap[sid] ? idMap[sid] : sid); });

        // subjects removed from the editor: unassign, and hard-delete only if they have no attendance history
        const keepIds = new Set(tmpSubjects.filter(s => !String(s.id).startsWith('new_')).map(s => s.id));
        const removed = SUBJECTS.filter(s => !keepIds.has(s.id));
        for (const s of removed) {
          if (s.total === 0) { await sb.from('subjects').delete().eq('id', s.id); }
        }

        await sb.from('timetable').delete().eq('user_id', CURRENT_USER.id).eq('semester_id', SETTINGS.semesterId);
        const rows = [];
        DAYS.forEach(d => {
          (tmpTimetable[d] || []).forEach((sid, i) => {
            if (sid) rows.push({ user_id: CURRENT_USER.id, semester_id: SETTINGS.semesterId, day_of_week: d, period_number: i + 1, subject_id: sid, period_time: PERIOD_TIMES[i] || ('Period ' + (i + 1)) });
          });
        });
        if (rows.length) { const { error } = await sb.from('timetable').insert(rows); if (error) throw error; }
        await sb.from('attendance_settings').update({ periods_per_day: periodsPerDay, semester }).eq('user_id', CURRENT_USER.id);
      },
      async getAttendanceForDate(dateStr, periodsCount) {
        const { data, error } = await sb.from('attendance').select('period_number,status,subject_id').eq('user_id', CURRENT_USER.id).eq('semester_id', SETTINGS.semesterId).eq('att_date', dateStr);
        if (error) throw error;
        const statuses = Array.from({ length: periodsCount }, () => 'not-marked');
        (data || []).forEach(r => { if (r.period_number >= 1 && r.period_number <= periodsCount) statuses[r.period_number - 1] = r.status; });
        return statuses;
      },
      async saveAttendance(dateStr, rows) { // rows: [{period_number, subject_id, status}]
        const payload = rows.map(r => ({ user_id: CURRENT_USER.id, semester_id: SETTINGS.semesterId, subject_id: r.subject_id, att_date: dateStr, period_number: r.period_number, status: r.status, updated_at: new Date().toISOString() }));
        const { error } = await sb.from('attendance').upsert(payload, { onConflict: 'user_id,semester_id,att_date,period_number' });
        if (error) throw error;
      },
      async getNotifications() {
        const { data, error } = await sb.from('notifications').select('*').eq('user_id', CURRENT_USER.id).order('created_at', { ascending: false }).limit(30);
        if (error) throw error; return data || [];
      },
      async markNotificationRead(id) { await sb.from('notifications').update({ is_read: true }).eq('id', id); },
      async markAllNotificationsRead() { await sb.from('notifications').update({ is_read: true }).eq('user_id', CURRENT_USER.id).eq('is_read', false); },
      async getLeavePlans() {
        const { data, error } = await sb.from('leave_plans').select('*').eq('user_id', CURRENT_USER.id).eq('semester_id', SETTINGS.semesterId).order('plan_date');
        if (error) throw error; return data || [];
      },
      async addLeavePlan(date, periods, subjectIds) {
        const { error } = await sb.from('leave_plans').insert({ user_id: CURRENT_USER.id, semester_id: SETTINGS.semesterId, plan_date: date, periods, subject_ids: subjectIds });
        if (error) throw error;
      },
      async adminOverview() {
        const { data, error } = await sb.rpc('admin_student_overview');
        if (error) throw error; return data || [];
      }
    };

    /* ============================================================
       SESSION / APP ENTRY
       ============================================================ */
    const ACCESS_MESSAGES = {
      pending: 'Your account is pending admin approval. Please try again after it has been approved.',
      rejected: 'Your registration was rejected by the administrator.',
      deactivated: 'Your account has been deactivated. Please contact the administrator.',
      cancelled: 'Your account has been cancelled. Please contact the administrator.'
    };
    function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    async function checkAccess() {
      const { data, error } = await sb.rpc('my_access');
      if (error) return { ok: false, message: 'Could not verify your account: ' + error.message };
      const me = (data || [])[0];
      if (!me) return { ok: false, message: 'Account profile not found. Please contact the administrator.' };
      if (me.role === 'admin' || me.status === 'approved') return { ok: true, role: me.role };
      let m = ACCESS_MESSAGES[me.status] || 'Your account cannot sign in right now.';
      if (me.status_note) m += ' Note from admin: ' + me.status_note;
      return { ok: false, message: m };
    }
    async function kickToLogin(message) {
      await sb.auth.signOut();
      CURRENT_USER = null; PROFILE = null;
      document.getElementById('app').classList.remove('active');
      document.getElementById('auth-screen').style.display = 'flex';
      renderLogin(message);
    }
    // If the admin deactivates/cancels an account while the student is signed in, sign them out.
    setInterval(async () => {
      if (!CURRENT_USER || STATE.role === 'admin') return;
      const g = await checkAccess();
      if (!g.ok) await kickToLogin(g.message);
    }, 60000);
    async function loadAllData() {
      PROFILE = await DB.getProfile();
      STATE.role = PROFILE.role === 'admin' ? 'admin' : 'student';
      if (STATE.role === 'admin') {
        ADMIN_STUDENTS = await DB.adminOverview();
        return;
      }
      const settingsRow = await DB.getSettings();
      SETTINGS = { target: +settingsRow.target_percent, warning: +settingsRow.warning_percent, critical: +settingsRow.critical_percent, periodsPerDay: settingsRow.periods_per_day, semester: settingsRow.semester || 'Semester 1', year: settingsRow.academic_year || '' };
      const sem = await DB.ensureSemester(); SETTINGS.semesterId = sem.id; SETTINGS.semester = sem.name;
      SUBJECTS = await DB.getSubjects();
      const tt = await DB.getTimetable(); TIMETABLE = tt.timetable; PERIOD_TIMES = tt.times;
      ATT_SELECTED_DATE = new Date().toISOString().slice(0, 10);
      TODAY_SUBJECT_IDS = TIMETABLE[TODAY_DAY] || [];
      TODAY_STATUS = await DB.getAttendanceForDate(ATT_SELECTED_DATE, SETTINGS.periodsPerDay);
      NOTIFICATIONS = await DB.getNotifications();
      LEAVE_PLANS = await DB.getLeavePlans();
    }

    async function enterApp() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { toast('Session expired, please sign in again', 'error'); renderLogin(); return; }
      CURRENT_USER = session.user;
      const gate = await checkAccess();
      if (!gate.ok) { await kickToLogin(gate.message); return; }
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app').classList.remove('active');
      document.body.style.cursor = 'wait';
      try {
        await loadAllData();
      } catch (err) {
        console.error(err);
        toast('Could not load your data: ' + err.message, 'error');
      }
      document.body.style.cursor = '';
      document.getElementById('app').classList.add('active');
      const initials = (PROFILE.full_name || PROFILE.email || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      document.getElementById('avatar-init').textContent = initials;
      document.getElementById('chip-name').textContent = PROFILE.full_name || PROFILE.email;
      document.getElementById('chip-role').textContent = STATE.role === 'admin' ? 'Administrator' : 'Student';
      buildSidebar(); buildBottomNav();
      goToView(STATE.role === 'admin' ? 'admin' : 'dashboard');
    }

    async function loadSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) { CURRENT_USER = session.user; await enterApp(); }
      else { renderLogin(); }
    }

      else if (id === 'leave') renderLeavePlanner();

      </div>
      <div class="card clay pad-md stat-card"><div class="stat-label">Classes present</div><div class="stat-value">${present}</div><div class="stat-delta text-green">of ${total} marked</div></div>
      <div class="card clay pad-md stat-card"><div class="stat-label">Classes absent</div><div class="stat-value">${total - present}</div><div class="stat-delta muted">${total > 0 ? (100 - overallPct).toFixed(1) : '0.0'}% miss rate</div></div>
      <div class="card clay pad-md stat-card"><div class="stat-label">Target progress</div><div class="stat-value">${SETTINGS.target}%</div><div class="stat-delta ${overallPct >= SETTINGS.target ? 'text-green' : 'text-red'}">${overallPct >= SETTINGS.target ? 'On track' : (overallPct - SETTINGS.target).toFixed(1) + '% to go'}</div></div>
    </div>
    <div class="grid grid-dash block">
      <div class="card clay pad-lg">
        <div class="block-head"><div class="block-title">Subjects overview</div><span class="badge badge-neutral">Live from database</span></div>
        <canvas id="chart-trend" height="130"></canvas>
      </div>
      <div class="card clay pad-lg" style="display:flex; flex-direction:column; align-items:center; justify-content:center;">

        <div class="legend"><span><i style="background:${sMeta.color}"></i>${present} present</span><span><i style="background:var(--border)"></i>${total - present} absent</span></div>
      </div>
    </div>
    <div class="grid grid-2 block">
      <div>
        <div class="block-head"><div class="block-title">Subjects needing attention</div><span class="block-link" data-goto-view="subjects">View all ${ICONS.chevRight}</span></div>
        <div class="card clay pad-sm">
          ${lowSubjects.map(s => {

        return `<div class="period-row" style="cursor:pointer" data-open-subject="${s.id}"><div class="period-left"><div class="period-num" style="background:${s.color}22; color:${s.color}">${s.code.slice(0, 3)}</div><div class="period-info"><div class="pname">${s.name}</div><div class="ptime">${s.present}/${s.total} classes</div></div></div><span class="badge ${sm.badge}">${s.total > 0 ? p.toFixed(1) + '%' : '—'}</span></div>`;
      }).join('')}
        </div>

        <div class="block-head"><div class="block-title">Today's schedule — ${TODAY_DAY}</div><span class="block-link" data-goto-view="attendance">Mark now ${ICONS.chevRight}</span></div>

      });

    function dayNameFor(dateStr) { const d = new Date(dateStr + 'T00:00:00'); const idx = d.getDay(); if (idx === 0) return 'Sunday'; return DAYS[idx - 1] || 'Monday'; }
    async function loadPeriodEditor(dateStr) {
      const day = dayNameFor(dateStr);

      const wrap = document.getElementById('att-periods');

        TODAY_STATUS = await DB.getAttendanceForDate(dateStr, SETTINGS.periodsPerDay);
      } catch (err) { toast('Could not load attendance: ' + err.message, 'error'); TODAY_STATUS = Array.from({ length: SETTINGS.periodsPerDay }, () => 'not-marked'); }

        };

        const doCalc = () => {
          const { present, total, label } = readSource('sl'); const target = parseFloat(document.getElementById('sl-target').value) || SETTINGS.target; const cur = pct(present, total); const safe = safeLeavesAllowed(present, total, target);

        };
        document.getElementById('sl-calc').addEventListener('click', doCalc); doCalc();
      }
      if (STATE.calcTab === 'whatif') {
        body.innerHTML = `<div class="grid grid-dash"><div class="card clay pad-lg">${sourceFieldsHTML('wi')}<div class="two-col"><div class="field"><label>Future classes attended</label><input class="input" id="wi-attend" type="number" value="4" min="0"></div><div class="field"><label>Future classes missed</label><input class="input" id="wi-miss" type="number" value="1" min="0"></div></div><button class="btn btn-primary btn-block" id="wi-calc">Simulate</button></div><div class="card clay pad-lg" id="wi-result"></div></div>`;

          const { present, total, label } = readSource('wi'); const attend = Math.max(0, parseInt(document.getElementById('wi-attend').value) || 0); const miss = Math.max(0, parseInt(document.getElementById('wi-miss').value) || 0);

          document.getElementById('wi-result').innerHTML = `<div class="flex justify-between" style="margin-bottom:14px;"><div><div class="stat-label">Current</div><div class="stat-value">${curPct.toFixed(1)}%</div></div><div style="align-self:center; font-size:22px; color:var(--muted);">→</div><div style="text-align:right;"><div class="stat-label">Projected</div><div class="stat-value" style="color:${newPct >= SETTINGS.target ? 'var(--green)' : 'var(--red)'}">${newPct.toFixed(1)}%</div></div></div><div class="bar-track" style="margin-bottom:8px;"><div class="bar-fill" style="width:${Math.min(newPct, 100)}%; background:${newPct >= SETTINGS.target ? 'var(--green)' : 'var(--red)'}"></div></div><p class="muted" style="font-size:13px;">${delta >= 0 ? '+' : ''}${delta.toFixed(1)} percentage points, based on ${newPresent}/${newTotal} classes. ${newPct >= SETTINGS.target ? 'Still at or above your ' + SETTINGS.target + '% target.' : 'This would put you below your ' + SETTINGS.target + '% target.'}</p>`;
        };

        const m = /(\d+)\s*$/.exec(SETTINGS.semester || ''); const suggestion = m ? SETTINGS.semester.replace(/(\d+)\s*$/, (+m[1] + 1)) : 'Semester ' + (SUBJECTS.length ? 2 : 1);
        openModal(`
      <div class="modal-head"><h3 class="font-display" style="margin:0;">Start a new semester</h3><button class="icon-btn" onclick="closeModal()">${ICONS.x}</button></div>
      <div class="modal-body">
        <div class="two-col">
          <div class="field"><label>Semester name</label><input class="input" id="ns-name" value="${esc(suggestion)}"></div>
          <div class="field"><label>Academic year</label><input class="input" id="ns-year" value="${esc(SETTINGS.year)}"></div>
        </div>
        <p class="muted" style="font-size:12.5px;">"${esc(SETTINGS.semester)}" will be closed and kept as history. The new semester starts with no subjects, timetable or attendance — add them from Timetable → Edit timetable. This cannot be undone.</p>
      </div>
      <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="ns-save">Start semester</button></div>`);
        document.getElementById('ns-save').addEventListener('click', async () => {
          const name = document.getElementById('ns-name').value.trim();
          if (!name) { toast('Enter a semester name', 'error'); return; }
          const btn = document.getElementById('ns-save'); btn.disabled = true; btn.innerHTML = spin() + ' Starting…';
          try {
            await DB.startNewSemester(name, document.getElementById('ns-year').value.trim());
            await loadAllData(); closeModal(); toast('New semester started'); goToView('dashboard');
          } catch (err) { toast('Could not start semester: ' + err.message, 'error'); btn.disabled = false; btn.textContent = 'Start semester'; }
        });
      });
    }
    function renderSettings() {
      const el = document.getElementById('view-settings');
      el.innerHTML = `
    <div class="grid grid-dash">
      <div class="card clay pad-lg block">
        <div class="block-title" style="margin-bottom:16px;">Profile</div>
        <div class="flex items-center gap-12" style="margin-bottom:20px;"><div class="avatar" style="width:56px; height:56px; font-size:18px;">${(PROFILE.full_name || PROFILE.email || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase()}</div><div><div style="font-weight:700;">${PROFILE.full_name || ''}</div><div class="muted" style="font-size:12.5px;">${PROFILE.email}</div></div></div>
        <div class="two-col"><div class="field"><label>Full name</label><input class="input" id="pf-name" value="${PROFILE.full_name || ''}"></div><div class="field"><label>Email</label><input class="input" value="${PROFILE.email}" disabled></div></div>
        <div class="two-col"><div class="field"><label>Student ID</label><input class="input" value="${PROFILE.student_id || ''}" disabled></div><div class="field"><label>Section</label><input class="input" id="pf-section" value="${PROFILE.section || ''}"></div></div>
        <div class="two-col"><div class="field"><label>Department / Trade</label><input class="input" id="pf-dept" list="dept-options-2" value="${PROFILE.department || ''}"><datalist id="dept-options-2">${DEPARTMENTS.map(d => `<option value="${d}">`).join('')}</datalist></div><div class="field"><label>Year</label><select class="input" id="pf-year"><option ${PROFILE.year === '1st Year' ? 'selected' : ''}>1st Year</option><option ${PROFILE.year === '2nd Year' ? 'selected' : ''}>2nd Year</option><option ${PROFILE.year === '3rd Year' ? 'selected' : ''}>3rd Year</option><option ${PROFILE.year === '4th Year' ? 'selected' : ''}>4th Year</option></select></div></div>
        <button class="btn btn-primary" id="save-profile">Save changes</button>
      </div>
      <div class="card clay pad-lg block">
        <div class="block-title" style="margin-bottom:16px;">Attendance settings</div>
        <div class="field"><label>Target attendance percentage</label><input class="input" type="number" id="set-target" value="${SETTINGS.target}" min="1" max="100"></div>
        <div class="two-col"><div class="field"><label>Warning threshold %</label><input class="input" type="number" id="set-warn" value="${SETTINGS.warning}"></div><div class="field"><label>Critical threshold %</label><input class="input" type="number" id="set-crit" value="${SETTINGS.critical}"></div></div>
        <div class="field"><label>Academic year</label><input class="input" id="set-year" value="${SETTINGS.year}"></div>
        <button class="btn btn-primary" id="save-settings">Save settings</button>
        ${STATE.role === 'admin' ? '' : `<hr class="div">
        <div class="block-title" style="margin-bottom:6px; font-size:15px;">Semester</div>
        <p class="muted" style="font-size:12.5px; margin-top:0;">Current: <b>${esc(SETTINGS.semester)}</b>. Starting a new semester begins with no subjects, timetable or attendance. Earlier semesters stay saved under Reports → Semesters.</p>
        <button class="btn btn-secondary" id="new-semester">Start new semester</button>`}
      </div>
    </div>`;
      bindSemesterControls();
      document.getElementById('save-profile').addEventListener('click', async () => {
        try {
          await DB.saveProfile({ full_name: document.getElementById('pf-name').value, section: document.getElementById('pf-section').value, department: document.getElementById('pf-dept').value, year: document.getElementById('pf-year').value });
          PROFILE = await DB.getProfile();
          document.getElementById('chip-name').textContent = PROFILE.full_name || PROFILE.email;
          toast('Profile updated');
        } catch (err) { toast('Could not save: ' + err.message, 'error'); }
      });
      document.getElementById('save-settings').addEventListener('click', async () => {
        const patch = { target_percent: parseFloat(document.getElementById('set-target').value) || SETTINGS.target, warning_percent: parseFloat(document.getElementById('set-warn').value) || SETTINGS.warning, critical_percent: parseFloat(document.getElementById('set-crit').value) || SETTINGS.critical, academic_year: document.getElementById('set-year').value };
        try { await DB.saveSettings(patch); const s = await DB.getSettings(); SETTINGS.target = +s.target_percent; SETTINGS.warning = +s.warning_percent; SETTINGS.critical = +s.critical_percent; SETTINGS.year = s.academic_year; toast('Attendance settings saved'); }
        catch (err) { toast('Could not save: ' + err.message, 'error'); }
      });
    }

    /* ============================================================
       ADMIN
       ============================================================ */
    const ACCOUNT_META = {
      pending: { label: 'Pending', badge: 'badge-amber' }, approved: { label: 'Approved', badge: 'badge-green' },
      rejected: { label: 'Rejected', badge: 'badge-red' }, deactivated: { label: 'Deactivated', badge: 'badge-neutral' },
      cancelled: { label: 'Cancelled', badge: 'badge-neutral' }
    };
    async function adminChangeStatus(id, status, note) {
      await DB.setStudentStatus(id, status, note);
      ADMIN_STUDENTS = await DB.adminOverview();
      renderAdmin();
    }
    function renderAdmin() {
      const el = document.getElementById('view-admin');
      const approvedList = ADMIN_STUDENTS.filter(s => s.status === 'approved');
      const withData = approvedList.filter(s => +s.total_count > 0);
      const below = withData.filter(s => +s.pct < SETTINGS.target).length;
      const counts = { all: ADMIN_STUDENTS.length };
      Object.keys(ACCOUNT_META).forEach(k => counts[k] = ADMIN_STUDENTS.filter(s => s.status === k).length);
      el.innerHTML = `
    <div class="grid grid-4 block">
      <div class="card clay pad-md stat-card"><div class="stat-label">Total students</div><div class="stat-value">${ADMIN_STUDENTS.length}</div></div>
      <div class="card clay pad-md stat-card"><div class="stat-label">Pending approval</div><div class="stat-value ${counts.pending ? 'text-red' : ''}">${counts.pending}</div></div>
      <div class="card clay pad-md stat-card"><div class="stat-label">Below target</div><div class="stat-value text-red">${below}</div></div>
      <div class="card clay pad-md stat-card"><div class="stat-label">Avg. attendance</div><div class="stat-value">${withData.length ? (withData.reduce((a, s) => a + (+s.pct), 0) / withData.length).toFixed(1) : '0.0'}%</div></div>
    </div>
    <div class="tabs block" id="admin-tabs" style="flex-wrap:wrap;">
      ${['all', 'pending', 'approved', 'rejected', 'deactivated', 'cancelled'].map(k => `<button class="tab-btn ${ADMIN_FILTER === k ? 'active' : ''}" data-admin-filter="${k}">${k === 'all' ? 'All' : ACCOUNT_META[k].label} (${counts[k]})</button>`).join('')}
    </div>
    <div class="flex justify-between items-center" style="margin-bottom:14px; gap:12px; flex-wrap:wrap;">
      <div class="block-title mb-0">Students</div>
      <div class="input-wrap" style="max-width:260px;"><input class="input" placeholder="Search students…" id="admin-search"><span class="eye" style="pointer-events:none;">${ICONS.search}</span></div>
    </div>
    <div class="table-wrap card clay" style="border:none;"><div class="scroll-x"><table class="sams-table" id="admin-table">
      <thead><tr><th>Name</th><th>Student ID</th><th>Department</th><th>Semester</th><th>Attendance</th><th>Status</th><th>Account</th><th></th></tr></thead><tbody></tbody>
    </table></div></div>`;
      el.querySelectorAll('[data-admin-filter]').forEach(b => b.addEventListener('click', () => { ADMIN_FILTER = b.getAttribute('data-admin-filter'); renderAdmin(); }));

      function quick(id, status, note) {
        adminChangeStatus(id, status, note).then(() => toast('Student ' + ACCOUNT_META[status].label.toLowerCase())).catch(err => toast('Could not update: ' + err.message, 'error'));
      }
      function paint(filter = '') {
        const f = filter.toLowerCase();
        const tbody = document.querySelector('#admin-table tbody');
        const rows = ADMIN_STUDENTS.filter(s => (ADMIN_FILTER === 'all' || s.status === ADMIN_FILTER) &&
          ((s.full_name || '').toLowerCase().includes(f) || (s.student_id || '').toLowerCase().includes(f) || (s.email || '').toLowerCase().includes(f)));
        tbody.innerHTML = rows.map(s => {
          const p = +s.pct; const st = statusFor(p); const sm = statusMeta(st); const am = ACCOUNT_META[s.status] || ACCOUNT_META.pending;
          const isApproved = s.status === 'approved';
          const quickBtns = s.status === 'pending'
            ? `<button class="btn btn-primary btn-sm" data-q-approve="${s.id}">Approve</button> <button class="btn btn-secondary btn-sm" data-q-reject="${s.id}">Reject</button> `
            : '';
          return `<tr><td><b>${esc(s.full_name) || '—'}</b><br><span class="muted" style="font-size:11.5px;">${esc(s.email)}</span></td><td>${esc(s.student_id) || '—'}</td><td>${esc(s.department) || '—'}</td><td>${esc(s.semester_name)}</td>
        <td>${isApproved && +s.total_count > 0 ? p.toFixed(1) + '%' : '—'}</td><td>${isApproved ? (+s.total_count > 0 ? `<span class="badge ${sm.badge}">${sm.label}</span>` : '<span class="badge badge-neutral">No data</span>') : '—'}</td>
        <td><span class="badge ${am.badge}">${am.label}</span></td>
        <td style="white-space:nowrap;">${quickBtns}<span class="link-red" data-admin-view="${s.id}" style="font-weight:700; font-size:12.5px;">Manage ${ICONS.chevRight}</span></td></tr>`;
        }).join('')
          || `<tr><td colspan="8"><div class="empty-state">${icon('search', 'icon')}<h4>No students found</h4><p>Try a different filter or search term.</p></div></td></tr>`;
        tbody.querySelectorAll('[data-q-approve]').forEach(x => x.addEventListener('click', () => quick(x.getAttribute('data-q-approve'), 'approved')));
        tbody.querySelectorAll('[data-q-reject]').forEach(x => x.addEventListener('click', () => { if (confirm('Reject this registration?')) quick(x.getAttribute('data-q-reject'), 'rejected'); }));
        tbody.querySelectorAll('[data-admin-view]').forEach(x => x.addEventListener('click', () => openStudentModal(x.getAttribute('data-admin-view'))));
      }
      paint();
      document.getElementById('admin-search').addEventListener('input', (e) => paint(e.target.value));
    }

    function openStudentModal(id) {
      const s = ADMIN_STUDENTS.find(m => m.id === id); if (!s) return;
      const p = +s.pct; const sm = statusMeta(statusFor(p)); const am = ACCOUNT_META[s.status] || ACCOUNT_META.pending;
      const btn = (status, label, cls) => s.status === status ? '' : `<button class="btn ${cls || 'btn-secondary'} btn-sm" data-set-status="${status}">${label}</button>`;
      openModal(`<div class="modal-head"><h3 class="font-display" style="margin:0;">${esc(s.full_name) || '—'}</h3><button class="icon-btn" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="modal-body"><div class="grid grid-2" style="margin-bottom:6px;">
      <div class="stat-card"><div class="stat-label">Student ID</div><div style="font-weight:700;">${esc(s.student_id) || '—'}</div></div>
      <div class="stat-card"><div class="stat-label">Department</div><div style="font-weight:700;">${esc(s.department) || '—'}</div></div>
      <div class="stat-card"><div class="stat-label">Account</div><span class="badge ${am.badge}" style="margin-top:4px;">${am.label}</span></div>
      <div class="stat-card"><div class="stat-label">${esc(s.semester_name)} attendance</div><div class="stat-value">${p.toFixed(1)}% <span class="badge ${sm.badge}" style="vertical-align:middle;">${sm.label}</span></div></div>
    </div>
    <p class="muted" style="font-size:13px;">${esc(s.semester_name)}: present ${s.present_count}, absent ${s.absent_count}, total ${s.total_count} marked classes.</p>
    <hr class="div">
    <div class="block-title" style="font-size:15px; margin-bottom:8px;">Account access</div>
    <div class="field"><label>Note to student (optional, shown on sign-in if not approved)</label><input class="input" id="st-note" value="${esc(s.status_note)}"></div>
    <div class="flex" style="gap:8px; flex-wrap:wrap;">
      ${btn('approved', s.status === 'pending' ? 'Approve' : 'Reactivate', 'btn-primary')}${btn('rejected', 'Reject')}${btn('deactivated', 'Deactivate')}${btn('cancelled', 'Cancel account')}${s.status === 'pending' ? '' : btn('pending', 'Set to pending')}
    </div>
    <hr class="div">
    <div class="block-title" style="font-size:15px; margin-bottom:8px;">Attendance by semester</div>
    <div id="st-history" class="muted" style="font-size:13px;">${spin()} Loading…</div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>`);
      document.querySelectorAll('[data-set-status]').forEach(b => b.addEventListener('click', async () => {
        const status = b.getAttribute('data-set-status');
        if (['rejected', 'deactivated', 'cancelled'].includes(status) && !confirm('Set this student to ' + status + '? They will not be able to sign in.')) return;
        b.disabled = true;
        try { await adminChangeStatus(id, status, document.getElementById('st-note').value); closeModal(); toast('Student ' + ACCOUNT_META[status].label.toLowerCase()); }
        catch (err) { toast('Could not update: ' + err.message, 'error'); b.disabled = false; }
      }));
      DB.getSemesterHistory(id).then(list => {
        const box = document.getElementById('st-history'); if (!box) return;
        box.innerHTML = list.map(sem => `<div style="margin-bottom:12px;"><b>${esc(sem.name)}</b> <span class="badge ${sem.is_active ? 'badge-green' : 'badge-neutral'}">${sem.is_active ? 'Current' : 'Completed'}</span>
      <div class="muted" style="font-size:12.5px;">${sem.totals.total_classes} classes · ${sem.totals.total_present} present · ${sem.totals.total_absent} absent · ${(+sem.totals.attendance_percentage).toFixed(1)}%</div>
      ${sem.subjects.length ? `<div class="scroll-x"><table class="sams-table"><thead><tr><th>Subject</th><th>Present</th><th>Absent</th><th>Total</th><th>%</th></tr></thead><tbody>${sem.subjects.map(r => `<tr><td>${esc(r.subject_name)}</td><td>${r.total_present}</td><td>${r.total_absent}</td><td>${r.total_classes}</td><td>${(+r.attendance_percentage).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>` : ''}</div>`).join('') || 'No semester data yet.';
      }).catch(err => { const box = document.getElementById('st-history'); if (box) box.textContent = 'Could not load: ' + err.message; });
    }

    /* ============================================================
       INIT
       ============================================================ */
    initTheme();
    if (BACKEND_UNAVAILABLE) { renderBackendError(); } else { loadSession(); }
    setTimeout(() => document.getElementById('preloader').classList.add('hide'), 1100);
    sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') { /* handled explicitly on sign-out click */ } });

  </script>
</body>

</html>
